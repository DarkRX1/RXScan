name: Distribution artifacts

# Development distribution proof (no public release). Manual dispatch only:
# ordinary pushes never run this workflow and nothing here creates tags,
# GitHub Releases, crates.io publications, or store uploads. Historical
# tags are never touched. By default artifacts carry a -dev segment so
# nobody mistakes them for an official release; dispatch with
# official=true to rebuild byte-named official artifacts from a release
# commit (used for v1.1.0 publication).
on:
  workflow_dispatch:
    inputs:
      official:
        description: "Build official (non-dev) release artifacts"
        type: boolean
        default: false

# Least privilege: read the repo, upload workflow artifacts only.
permissions:
  contents: read
  actions: write

# Internal artifact-bundle names follow the mode (-dev vs -official);
# public filenames are derived from version metadata by the packaging
# scripts (DIST_SUFFIX is set per-mode in bash below).

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS arm64: native build AND native runtime on this runner.
          - os: macos-26
            target: aarch64-apple-darwin
          # macOS x86_64: BUILD ONLY. The macos-26 runner is Apple
          # Silicon, so no Intel runtime is claimed: the binary is
          # cross-built with the native Apple toolchain and packaged,
          # but smoke-tested for extraction/layout only.
          - os: macos-26
            target: x86_64-apple-darwin
            build_only: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}
      - name: Install cross linker (linux arm64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Add Apple Intel target (macOS x86_64 build only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage raw binary
        shell: bash
        run: |
          mkdir -p raw/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/rxscan.exe" "raw/${{ matrix.target }}/release/"
          else
            cp "target/${{ matrix.target }}/release/rxscan" "raw/${{ matrix.target }}/release/"
          fi
          ls -l "raw/${{ matrix.target }}/release"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-raw-${{ matrix.target }}
          path: raw/${{ matrix.target }}/release/rxscan*
          retention-days: 7

  apk:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.7 (wrapper pin)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Resolve Android NDK (verified before use, fail loudly)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/ndk" ]; then
              NDK_VER="$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
            else
              echo "no NDK: ANDROID_NDK_HOME unset and \$ANDROID_HOME/ndk missing" >&2
              exit 1
            fi
          fi
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" || (echo "NDK clang driver missing" && exit 1)
      - name: Build Rust core for Android (arm64-v8a + x86_64 emulator)
        shell: bash
        run: bash scripts/android-libs.sh
      - name: Assemble debug APK (debug-signed, never committed keys)
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          # Official releases carry the bare versionName; dev builds keep -dev.
          if [ "${{ inputs.official }}" = "true" ]; then EXTRA="-PrxscanRelease"; else EXTRA=""; fi
          # shellcheck disable=SC2086
          gradle assembleDebug --console=plain $EXTRA
      - name: Rename to version-derived APK name
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "${{ inputs.official }}" = "true" ]; then APK_SUFFIX=""; else APK_SUFFIX="-dev"; fi
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/RXScan-${VERSION}${APK_SUFFIX}-android-arm64.apk"
          ls -l dist
      - name: Static APK verification (badging, alignment, signature)
        shell: bash
        run: |
          set -euo pipefail
          # Globs do not expand in assignments: expand via an array and
          # require exactly one APK.
          apks=(dist/RXScan-*-android-arm64.apk)
          test "${#apks[@]}" -eq 1 || { echo "expected one APK, found: ${apks[*]}" >&2; ls dist >&2; exit 1; }
          APK="${apks[0]}"
          echo "APK=$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "build-tools: $BT"
          "$BT/aapt" dump badging "$APK" | head -n 20
          "$BT/aapt" dump badging "$APK" | grep -q "package: name='dev.rxscan.app.debug'"
          "$BT/aapt" dump badging "$APK" | grep -q "native-code: 'arm64-v8a'"
          "$BT/zipalign" -c -p 4 "$APK" && echo "zipalign ok"
          "$BT/apksigner" verify --print-certs "$APK"
      - name: Emulator install + launch smoke (x86_64 slice)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          arch: x86_64
          # One line: the action runs each line in a separate shell, so
          # the multi-step smoke lives in a repo script instead.
          script: bash scripts/android-emulator-smoke.sh 'dist/RXScan-*-android-arm64.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: rxscan-apk${{ inputs.official == true && '-official' || '-dev' }}
          path: dist/RXScan-*-android-arm64.apk
          retention-days: 14

  package:
    name: package + checksums + manifest
    needs: [build, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download raw binaries
        uses: actions/download-artifact@v4
        with:
          pattern: dist-raw-*
          path: _raw
          merge-multiple: false
      - name: Download dev APK
        uses: actions/download-artifact@v4
        with:
          name: rxscan-apk${{ inputs.official == true && '-official' || '-dev' }}
          path: _apk
      - name: Reconstruct target layout
        shell: bash
        run: |
          set -euo pipefail
          # Layout-agnostic: locate the staged binary inside each raw
          # artifact instead of assuming preserved directory nesting.
          for d in _raw/dist-raw-*/; do
            target="$(basename "$d" | sed 's/^dist-raw-//')"
            bin="$(find "$d" -type f -name 'rxscan*' | head -n 1)"
            test -n "$bin" || { echo "no binary inside $d:" >&2; find "$d" >&2; exit 1; }
            echo "$target <- $bin"
            mkdir -p "target/$target/release"
            cp "$bin" "target/$target/release/"
          done
          ls -R target | head -n 50
      - name: Package artifacts (version-derived names)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # DIST_SUFFIX drives scripts/package-artifact.sh naming:
          # '' for official releases, '-dev' for development builds.
          if [ "${{ inputs.official }}" = "true" ]; then export DIST_SUFFIX=""; else export DIST_SUFFIX="-dev"; fi
          bash scripts/package-artifact.sh x86_64-unknown-linux-gnu
          bash scripts/package-artifact.sh aarch64-unknown-linux-gnu
          bash scripts/package-artifact.sh x86_64-pc-windows-msvc
          bash scripts/package-artifact.sh aarch64-apple-darwin
          bash scripts/package-artifact.sh x86_64-apple-darwin
          cp _apk/RXScan-*-android-arm64.apk dist/
          ls -l dist
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.tar.gz *.zip *.apk) | tee dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Manifest (+ privacy self-check)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dist-manifest.py
          cat dist/release-manifest.json
          python3 - <<'EOF'
          import json
          m = json.load(open("dist/release-manifest.json"))
          assert m["project"] == "RXScan"
          assert isinstance(m["artifacts"], list) and len(m["artifacts"]) == 6
          blob = json.dumps(m)
          for needle in ("/home/", "/Users/", "C:\\", "RUNNER_", "GITHUB_"):
              assert needle not in blob, f"manifest leaks environment detail: {needle}"
          print("manifest schema + privacy OK")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: rxscan-dist${{ inputs.official == true && '-official' || '-dev' }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/SHA256SUMS
            dist/release-manifest.json
          retention-days: 14

  smoke-linux:
    name: smoke linux artifacts
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download distribution archives
        uses: actions/download-artifact@v4
        with:
          name: rxscan-dist${{ inputs.official == true && '-official' || '-dev' }}
          path: dist
      - name: Smoke x86_64 (native execution after extraction)
        shell: bash
        run: bash scripts/dist-smoke.sh dist/RXScan-*-linux-x86_64.tar.gz
      - name: "Verify aarch64 (build-only: extraction + layout, no execution)"
        shell: bash
        run: |
          bash scripts/dist-smoke.sh dist/RXScan-*-linux-aarch64.tar.gz --build-only
          file dist/RXScan-*-linux-aarch64.tar.gz

  smoke-windows:
    name: smoke windows artifact
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download distribution archives
        uses: actions/download-artifact@v4
        with:
          name: rxscan-dist${{ inputs.official == true && '-official' || '-dev' }}
          path: dist
      - name: Extract archive
        shell: pwsh
        run: |
          Get-ChildItem dist
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Expand-Archive dist/RXScan-*-windows-x86_64.zip -DestinationPath smoke
          Get-ChildItem smoke
          if (!(Test-Path smoke/rxscan.exe)) { throw "rxscan.exe missing after extraction" }
          if (!(Test-Path smoke/LICENSE)) { throw "LICENSE missing after extraction" }
          if (!(Test-Path smoke/README.md)) { throw "README.md missing after extraction" }
      - name: Launch from PowerShell
        shell: pwsh
        run: |
          .\smoke\rxscan.exe --version
          .\smoke\rxscan.exe capabilities | Out-Null
          .\smoke\rxscan.exe capabilities --json | Out-Null
      - name: Launch from cmd.exe
        shell: cmd
        run: smoke\rxscan.exe --version
      - name: Launch from Git Bash + offline GUI smoke
        shell: bash
        run: |
          ./smoke/rxscan.exe --version
          ./smoke/rxscan.exe capabilities --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "environment" in d'
          mkdir -p smoke-web
          ./smoke/rxscan.exe web --port 0 --no-open --data-dir smoke-web > smoke-web.log 2>&1 &
          SRV=$!
          BASE=""
          for i in $(seq 1 100); do
            sleep 0.2
            kill -0 $SRV 2>/dev/null || { echo "server exited:"; cat smoke-web.log; exit 1; }
            BASE=$(grep -Eo 'http://127\.0\.0\.1:[0-9]+' smoke-web.log | head -n 1 || true)
            [ -n "$BASE" ] && break
          done
          [ -n "$BASE" ] || { cat smoke-web.log; exit 1; }
          python3 - "$BASE" <<'EOF'
          import json,sys,urllib.request
          base = sys.argv[1]
          assert json.load(urllib.request.urlopen(base + "/api/v1/health", timeout=10))["status"] == "ok"
          assert "RXScan" in urllib.request.urlopen(base + "/", timeout=10).read().decode("utf-8", "replace")
          print("windows GUI smoke ok")
          EOF
          kill $SRV 2>/dev/null || true

  smoke-macos:
    name: smoke macos artifacts
    needs: package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Download distribution archives
        uses: actions/download-artifact@v4
        with:
          name: rxscan-dist${{ inputs.official == true && '-official' || '-dev' }}
          path: dist
      - name: Smoke arm64 (native execution after extraction)
        shell: bash
        run: bash scripts/dist-smoke.sh dist/RXScan-*-macos-arm64.tar.gz
      - name: "Verify x86_64 (build-only: extraction + arch check, no execution)"
        shell: bash
        run: |
          bash scripts/dist-smoke.sh dist/RXScan-*-macos-x86_64.tar.gz --build-only
          D=$(mktemp -d)
          tar -xzf dist/RXScan-*-macos-x86_64.tar.gz -C "$D"
          lipo -archs "$D/rxscan" | grep -q x86_64
          rm -rf "$D"
          echo "macos x86_64 arch verified (build-only, no runtime claim)"
