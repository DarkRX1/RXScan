[package]
name = "rxscan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reactive Recon Scanner — simple outside, serious inside."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "zeroize"] }
ipnet = { version = "2.10", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
url = "2.5"
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"
