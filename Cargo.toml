[package]
name = "rxscan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reactive Recon Scanner — simple outside, serious inside."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ipnet = { version = "2.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
url = "2.5"
