[package]
name = "rxscan"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
description = "RXScan — Reconnaissance & Evidence Engine."
license = "MIT"
repository = "https://github.com/DarkRX1/RXScan"
homepage = "https://github.com/DarkRX1/RXScan"
documentation = "https://github.com/DarkRX1/RXScan/blob/master/README.md"
# Packaging policy: the crate ships RXScan build/runtime material only.
# The personal portfolio (root index.html, js/, css/, _headers,
# certificates/) and local runtime state (.rxscan-web/, databases, logs)
# are never packaged. GUI (app/), logo, provider corpus, fingerprints,
# and required runtime assets are intentionally included via `include`.
include = [
    "src/**/*",
    "app/**/*",
    "search/**/*",
    "fingerprints/**/*",
    "fixtures/**/*",
    "tests/**/*",
    "examples/**/*",
    "docs/**/*",
    "benches/**/*",
    "scripts/**/*",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "SECURITY.md",
    "RXScanlogo.png",
]
exclude = [
    ".rxscan-web/**",
    "*.sqlite",
    "*.sqlite-journal",
    "*.db",
    "*.log",
    "target/**",
    "index.html",
    "js/**",
    "css/**",
    "_headers",
    "certificates/**",
    "portfolio/**",
    "site/**",
    ".env",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "zeroize"] }
ipnet = { version = "2.10", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
url = "2.5"
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"

# Android embedding reuses the same library: the APK loads librxscan.so
# (cdylib) and starts the loopback server via the narrow `android` JNI
# module. rlib stays for the desktop binary and tests.
[lib]
name = "rxscan"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0"
